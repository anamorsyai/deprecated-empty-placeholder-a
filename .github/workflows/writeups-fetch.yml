name: Fetch bug bounty writeups

on:
  schedule:
    # Backup cadence only: the GitHub scheduler fires far less often than
    # asked, so the run chain below ("Queue next cycle") is what actually
    # keeps the ~5-minute rhythm. Kept so a broken chain restarts itself.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "taxonomy.json"

permissions:
  contents: write
  # Needed for the "Trigger site deploy" step below: pushes made with
  # GITHUB_TOKEN deliberately do NOT fire push workflows (GitHub's loop
  # protection), so without an explicit dispatch the hourly data commits
  # would sit unpublished until the next code push.
  actions: write

concurrency:
  # Shared with lessons-backfill.yml: only one data-writing job at a time.
  # Both jobs append to data/writeups.json, so overlapping runs rebase-conflict
  # and die (this already lost finished work twice). Queued, never cancelled.
  group: data-writer
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Shared by the pipeline step and the conflict-recovery re-run below.
    env:
      AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
      AI_USER_AGENT: ${{ secrets.AI_USER_AGENT }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      AI_TIMEOUT_MS: "150000"
      MAX_NEW_PER_RUN: "3"
      MAX_PER_SOURCE_PER_RUN: "2"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CUSTOM_API_BASE: ${{ secrets.CUSTOM_API_BASE }}
      CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
      CUSTOM_MODEL: ${{ secrets.CUSTOM_MODEL }}
      CUSTOM_API_HEADERS: ${{ secrets.CUSTOM_API_HEADERS }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      # Kill-switch for the self-perpetuating loop below: create an empty
      # file data/PAUSED in the repo and running cycles stop after the
      # current one (delete it to resume). The bot never touches this file.
      - name: Check loop flag
        id: loop
        run: |
          if [ -f data/PAUSED ]; then echo "paused=true"; echo "paused=true" >> "$GITHUB_OUTPUT"; else echo "paused=false" >> "$GITHUB_OUTPUT"; fi

      # Spaces chained runs ~5 minutes apart (the GitHub scheduler alone
      # fires far less often than the cron asks; chained dispatches would
      # otherwise run back-to-back with no pause).
      - name: Pace the loop
        if: steps.loop.outputs.paused != 'true'
        run: sleep 180

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.loop.outputs.paused != 'true'

      - name: Run the aggregation pipeline
        if: steps.loop.outputs.paused != 'true'
        run: npm run fetch

      - name: Commit updated data
        id: commit
        if: steps.loop.outputs.paused != 'true'
        run: |
          git config user.name "writeups-bot"
          git config user.email "actions@users.noreply.github.com"
          BEFORE_SHA=$(git rev-parse origin/main)
          git add data/writeups.json data/meta.json data/by-category/ data/blocklist.json
          git diff --cached --quiet || git commit -m "chore(data): refresh writeups $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Another fetch run may have pushed while we were working — both jobs
          # append to data/writeups.json, so a plain rebase conflicts and the
          # whole run fails (this already lost one batch of writeups). If the
          # rebase fails, regenerate on top of the fresh history instead:
          # dedupe makes the second pass a no-op for already-stored items.
          if ! git pull --rebase --autostash origin main; then
            git rebase --abort
            npm run fetch
            git add data/writeups.json data/meta.json data/by-category/ data/blocklist.json
            git diff --cached --quiet || git commit -m "chore(data): refresh writeups $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase --autostash origin main || git pull --rebase origin main
          fi
          git push || (git pull --rebase origin main && git push)
          if [ "$BEFORE_SHA" != "$(git rev-parse origin/main)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/writeups-deploy.yml/dispatches" \
            -d '{"ref":"main"}'

      # Self-driving loop (single dispatcher): GitHub fires our cron far less
      # often than asked AND cancels all but the newest queued run in a
      # concurrency group — so chained self-dispatches used to starve every
      # other data-writer. This step is the ONLY place that queues the next
      # cycle, and it first checks nothing else is already queued (else it
      # would cancel that run). It sends the baton to backfill while lessons
      # are missing, otherwise to the next fetch. Cron above is just a backup.
      - name: Queue next cycle
        if: always() && steps.loop.outputs.paused != 'true'
        run: |
          QUEUED=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=30" | \
            python3 -c "import json,sys; print(sum(1 for r in json.load(sys.stdin)['workflow_runs'] if r['status']=='queued'))")
          if [ "$QUEUED" != "0" ]; then echo "another run is queued, skipping self-dispatch"; exit 0; fi
          MISSING=$(node -e "const d=require('./data/writeups.json');console.log(d.filter(w=>!((w.lesson||{}).walkthrough)).length)")
          if [ "$MISSING" -gt 5 ]; then
            WF=lessons-backfill.yml; DATA='{"ref":"main","inputs":{"max_items":"10"}}'
            echo "missing lessons: $MISSING -> dispatching backfill"
          else
            WF=writeups-fetch.yml; DATA='{"ref":"main"}'
            echo "missing lessons: $MISSING -> dispatching fetch"
          fi
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$WF/dispatches" \
            -d "$DATA"
