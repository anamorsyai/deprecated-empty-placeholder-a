name: Fetch bug bounty writeups

on:
  schedule:
    # Hourly — the per-run item caps in fetchWriteups.mjs are sized for this
    # cadence (small, frequent batches instead of big infrequent ones).
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "taxonomy.json"

permissions:
  contents: write

concurrency:
  group: writeups-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run the aggregation pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CUSTOM_API_BASE: ${{ secrets.CUSTOM_API_BASE }}
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
          CUSTOM_MODEL: ${{ secrets.CUSTOM_MODEL }}
          CUSTOM_API_HEADERS: ${{ secrets.CUSTOM_API_HEADERS }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: npm run fetch

      - name: Commit updated data
        run: |
          git config user.name "writeups-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/writeups.json data/meta.json data/by-category/
          git diff --cached --quiet || git commit -m "chore(data): refresh writeups $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
