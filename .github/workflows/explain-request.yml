name: Explain on request

# On-demand full explanation: a "Request explanation" button on any
# lesson-less writeup page opens a GitHub issue titled `[explain] <id>`.
# This workflow teaches exactly that writeup, publishes it, and closes the
# issue with a link. No secrets exposed, no extra infrastructure.
#
# Kill-switch: same data/PAUSED file as the fetch loop (checked at start).

on:
  issues:
    types: [opened]

permissions:
  contents: write
  actions: write
  issues: write

# NOTE: deliberately NO concurrency group here while diagnosing instant
# cancellation of issues-triggered runs. The single-item backfill pulls fresh
# base right before pushing, so the race window is tiny.
# concurrency:
#   group: data-writer
#   cancel-in-progress: false

jobs:
  teach:
    if: startsWith(github.event.issue.title, '[explain]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
      AI_USER_AGENT: ${{ secrets.AI_USER_AGENT }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      AI_TIMEOUT_MS: "150000"
      BACKFILL_MAX: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CUSTOM_API_BASE: ${{ secrets.CUSTOM_API_BASE }}
      CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
      CUSTOM_MODEL: ${{ secrets.CUSTOM_MODEL }}
      CUSTOM_API_HEADERS: ${{ secrets.CUSTOM_API_HEADERS }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Parse request
        id: req
        run: |
          BODY="${{ github.event.issue.body }}"
          WID=$(printf '%s' "$BODY" | grep -oE 'id: [0-9a-f]{12}' | head -1 | cut -d' ' -f2)
          if [ -z "$WID" ]; then
            gh issue comment "${{ github.event.issue.number }}" --body "Couldn't find a writeup id in this request — it should contain a line like \`id: abc123def456\`. Closing." --repo "${{ github.repository }}"
            gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "id=$WID" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -f data/PAUSED ]; then
            gh issue comment "${{ github.event.issue.number }}" --body "The teaching loop is currently paused — your request is queued and will be picked up when it resumes." --repo "${{ github.repository }}"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.req.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.req.outputs.ok == 'true'

      - name: Teach the writeup
        id: teach
        if: steps.req.outputs.ok == 'true'
        env:
          ONLY_IDS: ${{ steps.req.outputs.id }}
        run: |
          npm run backfill:lessons
          if git diff --quiet -- data/writeups.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and publish
        if: steps.req.outputs.ok == 'true' && steps.teach.outputs.changed == 'true'
        run: |
          git config user.name "writeups-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/writeups.json data/meta.json data/by-category/
          git commit -m "chore(data): requested explanation for ${{ steps.req.outputs.id }}"
          git pull --rebase --autostash origin main || git pull --rebase origin main
          for i in 1 2 3; do
            git push && break
            echo "push attempt $i failed, waiting 45s for the racing run to settle"
            sleep 45
            git pull --rebase --autostash origin main || true
          done
          git status -sb | head -3
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/writeups-deploy.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Reply and close
        if: always() && steps.req.outputs.ok == 'true'
        run: |
          PAGE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/writeup/${{ steps.req.outputs.id }}/"
          if [ "${{ steps.teach.outputs.changed }}" == "true" ]; then
            gh issue comment "${{ github.event.issue.number }}" --body "✅ Full breakdown is live: $PAGE (give the deploy a minute to publish)." --repo "${{ github.repository }}"
          else
            gh issue comment "${{ github.event.issue.number }}" --body "Couldn't produce a lesson this time (thin source content or AI hiccup) — it stays queued for the automatic backfill." --repo "${{ github.repository }}"
          fi
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}"
